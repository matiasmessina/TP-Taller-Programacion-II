openapi: 3.0.0
info:
  title: "API REST de Personas y Pizzas"
  description: "API para administrar los clientes de una pizzería y las pizzas que pidió cada uno"
  version: "1.0.0"

servers:
  - url: "/api"

components:
  schemas:
    Person:
      type: "object"
      required:
        - lname
      properties:
        fname:
          type: "string"
        lname:
          type: "string"
    Pizza:
      type: "object"
      required:
        - person_id
        - content
      properties:
        person_id:
          type: "integer"
        content:
          type: "string"
    PizzaUpdate:
      type: "object"
      required:
        - content
      properties:
        content:
          type: "string"
  parameters:
    lname:
      name: "lname"
      description: "Apellido de la persona"
      in: path
      required: True
      schema:
        type: "string"
    pizza_id:
      name: "pizza_id"
      description: "ID de la pizza"
      in: path
      required: true
      schema:
        type: "integer"

paths:
  /people:
    get:
      operationId: "people.read_all"
      tags:
        - "People"
      summary: "Lista todas las personas con sus pizzas"
      responses:
        "200":
          description: "Lista de personas leída correctamente"
    post:
      operationId: "people.create"
      tags:
        - People
      summary: "Crea una persona"
      requestBody:
          description: "Persona a crear"
          required: True
          content:
            application/json:
              schema:
                x-body-name: "person"
                $ref: "#/components/schemas/Person"
      responses:
        "201":
          description: "Persona creada correctamente"
        "400":
          description: "Falta el apellido o el JSON es inválido"
        "406":
          description: "Ya existe una persona con ese apellido"
  /people/{lname}:
    get:
      operationId: "people.read_one"
      tags:
        - People
      summary: "Trae una persona por apellido"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: "Persona leída correctamente"
        "404":
          description: "No existe una persona con ese apellido"
    put:
      tags:
        - People
      operationId: "people.update"
      summary: "Actualiza el nombre de una persona"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: "Persona actualizada correctamente"
        "400":
          description: "Falta el apellido en el cuerpo o el JSON es inválido"
        "404":
          description: "No existe una persona con ese apellido"
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: "person"
              $ref: "#/components/schemas/Person"
    delete:
      tags:
        - People
      operationId: "people.delete"
      summary: "Borra una persona y todas sus pizzas"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "204":
          description: "Persona borrada correctamente"
        "404":
          description: "No existe una persona con ese apellido"
  /pizzas:
    get:
      operationId: "pizzas.read_all"
      tags:
        - Pizzas
      summary: "Lista todas las pizzas, opcionalmente filtradas por persona"
      parameters:
        - name: "person_id"
          in: query
          required: false
          description: "Si se envía, devuelve solo las pizzas de esa persona"
          schema:
            type: "integer"
      responses:
        "200":
          description: "Lista de pizzas leída correctamente"
        "404":
          description: "No existe una persona con ese person_id"
    post:
      operationId: "pizzas.create"
      tags:
        - Pizzas
      summary: "Crea una pizza asociada a una persona"
      requestBody:
          description: "Pizza a crear"
          required: True
          content:
            application/json:
              schema:
                x-body-name: "pizza"
                $ref: "#/components/schemas/Pizza"
      responses:
        "201":
          description: "Pizza creada correctamente"
        "400":
          description: "Faltan datos obligatorios o el JSON es inválido"
        "404":
          description: "No existe una persona con ese person_id"
  /pizzas/{pizza_id}:
    get:
      operationId: "pizzas.read_one"
      tags:
        - Pizzas
      summary: "Trae una pizza por ID"
      parameters:
        - $ref: "#/components/parameters/pizza_id"
      responses:
        "200":
          description: "Pizza leída correctamente"
        "404":
          description: "No existe una pizza con ese ID"
    put:
      tags:
        - Pizzas
      operationId: "pizzas.update"
      summary: "Actualiza el contenido de una pizza"
      parameters:
        - $ref: "#/components/parameters/pizza_id"
      responses:
        "200":
          description: "Pizza actualizada correctamente"
        "400":
          description: "Faltan datos obligatorios o el JSON es inválido"
        "404":
          description: "No existe una pizza con ese ID"
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: "pizza"
              $ref: "#/components/schemas/PizzaUpdate"
    delete:
      tags:
        - Pizzas
      operationId: "pizzas.delete"
      summary: "Borra una pizza"
      parameters:
        - $ref: "#/components/parameters/pizza_id"
      responses:
        "204":
          description: "Pizza borrada correctamente"
        "404":
          description: "No existe una pizza con ese ID"
  /people/{lname}/pizzas:
    get:
      operationId: "people.read_pizzas"
      tags:
        - People
      summary: "Lista las pizzas de una persona"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: "Pizzas de la persona leídas correctamente"
        "404":
          description: "No existe una persona con ese apellido"
  /people/{lname}/resumen:
    get:
      operationId: "people.read_resumen"
      tags:
        - People
      summary: "Resumen de consumo de una persona"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: "Resumen generado correctamente"
        "404":
          description: "No existe una persona con ese apellido"